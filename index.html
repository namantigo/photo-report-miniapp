<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Фотоотчёт</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--tg-theme-bg-color, #f3f4f6);
      color: var(--tg-theme-text-color, #111827);
    }

    #app {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      margin-bottom: 20px;
    }

    .title {
      font-size: 25px;
      font-weight: 750;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 14px;
      opacity: .6;
    }

    .card {
      width: 100%;
      border: 0;
      text-align: left;
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111827);
      border-radius: 16px;
      padding: 17px;
      margin-bottom: 11px;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }

    .card:active {
      transform: scale(.985);
    }

    .card-title {
      font-size: 18px;
      font-weight: 650;
    }

    .card-info {
      margin-top: 7px;
      font-size: 14px;
      opacity: .6;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .number {
      min-width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }

    .content {
      flex: 1;
      min-width: 0;
    }

    .arrow {
      font-size: 23px;
      opacity: .3;
    }

    .status {
      margin-top: 6px;
      font-size: 13px;
    }

    .open {
      opacity: .55;
    }

    .busy {
      color: #d97706;
      font-weight: 600;
    }

    .done {
      color: #16a34a;
      font-weight: 600;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 0;
      background: transparent;
      color: var(--tg-theme-link-color, #2481cc);
      font-size: 16px;
      padding: 4px 0 15px;
      cursor: pointer;
    }

    .loader {
      text-align: center;
      padding: 60px 10px;
      opacity: .6;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 16px;
      border-radius: 14px;
    }

    .counter {
      margin-left: 5px;
      opacity: .55;
      font-weight: 400;
    }
  </style>
</head>

<body>

<div id="app">
  <div class="loader">Загрузка фотоотчёта…</div>
</div>

<script>
  const API_URL =
    'https://script.google.com/macros/s/AKfycbz449Moj-8zWz28NfTFWZp6-YInnVtHYxLnC8IzDDCbhouvr1dwhC_UtBwFttSwk9vxoA/exec';

  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
  }

  let appData = null;
  let currentLocation = null;


  async function loadData() {
    try {

      const response = await fetch(
        API_URL + '?action=data'
      );

      if (!response.ok) {
        throw new Error(
          'HTTP ' + response.status
        );
      }

      const result = await response.json();

      if (!result.ok) {
        throw new Error(
          result.error || 'Ошибка API'
        );
      }

      appData = result.data;

      renderLocations();

    } catch (error) {

      console.error(error);

      document.getElementById('app').innerHTML = `
        <div class="error">
          Не удалось загрузить данные.<br><br>
          ${escapeHtml(error.message)}
        </div>
      `;
    }
  }


  function renderLocations() {

    currentLocation = null;

    const event = appData.event;
    const locations = [...appData.locations]
      .sort((a, b) => Number(a.order) - Number(b.order));

    let html = `
      <div class="header">
        <div class="title">
          📸 ${escapeHtml(event.name)}
        </div>

        <div class="subtitle">
          Выберите локацию
        </div>
      </div>
    `;

    locations.forEach(location => {

      const tasks = appData.tasks.filter(
        task =>
          task.locationId === location.locationId &&
          task.status !== 'DONE'
      );

      html += `
        <button
          class="card"
          onclick="openLocation('${escapeJs(location.locationId)}')"
        >
          <div class="row">

            <div class="number">
              ${escapeHtml(location.number)}
            </div>

            <div class="content">
              <div class="card-title">
                ${escapeHtml(location.name)}
              </div>

              <div class="card-info">
                Осталось заданий:
                <b>${tasks.length}</b>
              </div>
            </div>

            <div class="arrow">›</div>

          </div>
        </button>
      `;
    });

    document.getElementById('app').innerHTML = html;
  }


  function openLocation(locationId) {

    currentLocation = appData.locations.find(
      item => item.locationId === locationId
    );

    if (!currentLocation) return;

    renderTasks();
  }


  function renderTasks() {

  const tasks = appData.tasks
    .filter(
      task =>
        task.locationId === currentLocation.locationId &&
        task.status !== 'DONE'
    )
    .sort((a, b) =>
      compareTaskNumbers(a.number, b.number)
    );

  let html = `
    <button class="back" onclick="renderLocations()">
      ‹ Назад
    </button>

    <div class="header">
      <div class="title">
        ${escapeHtml(currentLocation.number)}.
        ${escapeHtml(currentLocation.name)}
      </div>

      <div class="subtitle">
        Заданий:
        <b>${tasks.length}</b>
      </div>
    </div>
  `;

  if (tasks.length === 0) {

    html += `
      <div class="card">
        <div class="card-title">
          ✅ Всё выполнено
        </div>
      </div>
    `;

  } else {

    tasks.forEach(task => {

      let statusText = 'Готово к выполнению';
      let statusClass = 'open';

      if (task.status === 'IN_PROGRESS') {
        statusText = '⏳ Выполняется';
        statusClass = 'busy';
      }

      html += `
        <button
          type="button"
          class="card"
          onclick="testTaskClick('${escapeJs(task.taskId)}')"
        >
          <div class="row">

            <div class="number">
              ${escapeHtml(task.number)}
            </div>

            <div class="content">

              <div class="card-title">
                ${escapeHtml(task.name)}
              </div>

              <div class="status ${statusClass}">
                ${statusText}
              </div>

            </div>

            <div class="arrow">›</div>

          </div>
        </button>
      `;
    });
  }

  document.getElementById('app').innerHTML = html;
}


function testTaskClick(taskId) {
  alert('Нажато задание: ' + taskId);
}
  function compareTaskNumbers(a, b) {

    return String(a).localeCompare(
      String(b),
      undefined,
      {
        numeric: true,
        sensitivity: 'base'
      }
    );
  }


  function escapeHtml(value) {

    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }


  function escapeJs(value) {

    return String(value ?? '')
      .replaceAll('\\', '\\\\')
      .replaceAll("'", "\\'");
  }


  loadData();
</script>

</body>
</html>
