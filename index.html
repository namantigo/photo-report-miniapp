<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Фотоотчёт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--tg-theme-bg-color,#f3f4f6);color:var(--tg-theme-text-color,#111827)}
#app{max-width:760px;margin:auto;padding:16px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between}.title{font-size:24px;font-weight:760;margin-bottom:5px}.subtitle{font-size:14px;opacity:.65;margin-bottom:18px;line-height:1.4}
.icon-btn{border:0;background:var(--tg-theme-secondary-bg-color,#fff);border-radius:12px;padding:10px 12px;font-size:18px}
.card{width:100%;border:0;text-align:left;background:var(--tg-theme-secondary-bg-color,#fff);color:inherit;border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.row{display:flex;align-items:center;gap:12px}.content{flex:1;min-width:0}.number{min-width:42px;height:42px;padding:0 7px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);font-weight:750}
.card-title{font-size:17px;font-weight:650}.info,.req{margin-top:5px;font-size:13px;opacity:.62}.mine{margin-top:5px;font-size:13px;color:#16a34a;font-weight:650}.busy{margin-top:5px;font-size:13px;color:#d97706}.arrow{font-size:22px;opacity:.28}
.back{border:0;background:transparent;color:var(--tg-theme-link-color,#2481cc);font-size:16px;padding:3px 0 14px}.task-name{font-size:27px;font-weight:760}.instruction{padding:13px;border-radius:13px;background:var(--tg-theme-secondary-bg-color,#fff);margin:12px 0;line-height:1.4}
.counter{margin:14px 0 10px;font-size:16px}.action{width:100%;border:0;border-radius:14px;padding:16px;margin-top:9px;font-size:16px;font-weight:700}.blue{background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}.green{background:#16a34a;color:white}.red{background:transparent;border:1px solid #d14343;color:#d14343}.action:disabled{opacity:.4}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0 16px}.tile{position:relative;aspect-ratio:1/1;border-radius:13px;overflow:hidden;background:#e5e7eb}.tile img{width:100%;height:100%;object-fit:cover}.file-tile{height:100%;padding:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:#4b5563;word-break:break-word}.x{position:absolute;right:5px;top:5px;width:31px;height:31px;border:0;border-radius:50%;background:rgba(17,24,39,.82);color:#fff;font-size:21px;line-height:28px}.spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.38)}.spinner{width:30px;height:30px;border:3px solid rgba(0,0,0,.16);border-top-color:#111827;border-radius:50%;animation:rot .7s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;z-index:50;max-width:90%;text-align:center}
.error{padding:15px;border-radius:13px;background:#fee2e2;color:#991b1b}.empty{padding:22px;text-align:center;opacity:.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;z-index:100}.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--tg-theme-bg-color,#f3f4f6);border-radius:20px 20px 0 0;padding:18px}.field{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:11px;background:var(--tg-theme-secondary-bg-color,#fff);color:inherit;margin:6px 0 10px;font-size:15px}.label{font-size:13px;font-weight:650;margin-top:8px}.admin-block{background:var(--tg-theme-secondary-bg-color,#fff);padding:13px;border-radius:14px;margin:10px 0}.small{padding:10px 12px;border:0;border-radius:10px;margin:4px 4px 4px 0}.danger-text{color:#b91c1c}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>
<body>
<div id="app"></div>
<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
<input id="galleryInput" type="file" accept="image/*" multiple hidden>
<div id="overlay"></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbz449Moj-8zWz28NfTFWZp6-YInnVtHYxLnC8IzDDCbhouvr1dwhC_UtBwFttSwk9vxoA/exec';
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
const initData=tg?.initData||'';
const telegramUserId=tg?.initDataUnsafe?.user?.id?String(tg.initDataUnsafe.user.id):'';
const qs=new URLSearchParams(location.search);
const eventKey=qs.get('event')||tg?.initDataUnsafe?.start_param||'';

let data=null,dayId=null,locationId=null,taskId=null,busy=false;
let localThumbs={};
let adminPassword=sessionStorage.getItem('photo_admin_password')||'';

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");
const js=s=>String(s??'').replaceAll('\\','\\\\').replaceAll("'","\\'");

async function apiGet(){
  const r=await fetch(API_URL+'?action=data&t='+Date.now()+(eventKey?'&event='+encodeURIComponent(eventKey):''),{cache:'no-store'});
  const j=await r.json();if(!j.ok)throw new Error(j.code||j.error);return j.data;
}
async function api(body){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,initData,event:eventKey})});
  const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw new Error('Некорректный ответ сервера')}
  if(!j.ok)throw new Error(j.code||j.error||'Ошибка');return j;
}
function toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function top(title,sub,back=''){return `<div class="top"><div><div class="title">${esc(title)}</div>${sub?`<div class="subtitle">${esc(sub)}</div>`:''}</div><button class="icon-btn" onclick="openAdmin()">⚙️</button></div>${back?`<button class="back" onclick="${back}">‹ Назад</button>`:''}`}

async function start(){
  $('app').innerHTML='';
  try{data=await apiGet();renderDays()}catch(e){$('app').innerHTML=`<div class="error">Ошибка: ${esc(e.message)}</div>`}
}

/* Fast navigation: all screens render from memory; no GET between screens. */
function renderDays(){
  taskId=locationId=dayId=null;
  let h=top('📸 '+data.event.name,'Выберите день фотоотчёта');
  const days=[...(data.days||[])].sort((a,b)=>a.order-b.order);
  days.forEach(d=>{
    const ts=data.tasks.filter(t=>t.dayId===d.dayId),left=ts.filter(t=>t.status!=='DONE').length;
    h+=`<button class="card" onclick="openDay('${js(d.dayId)}')"><div class="row"><div class="number">${esc(d.day||d.order)}</div><div class="content"><div class="card-title">${esc(d.name)}</div><div class="info">${esc(d.date||'')} · Осталось: ${left}</div></div><div class="arrow">›</div></div></button>`;
  });
  $('app').innerHTML=h;
}
function openDay(id){dayId=id;renderLocations()}
function renderLocations(){
  locationId=taskId=null;const d=data.days.find(x=>x.dayId===dayId);
  let h=top(d?.name||'День','Выберите локацию','renderDays()');
  data.locations.filter(x=>x.dayId===dayId).sort((a,b)=>a.order-b.order).forEach(l=>{
    const left=data.tasks.filter(t=>t.locationId===l.locationId&&t.status!=='DONE').length;
    h+=`<button class="card" onclick="openLocation('${js(l.locationId)}')"><div class="row"><div class="number">${esc(l.number)}</div><div class="content"><div class="card-title">${esc(l.name)}</div><div class="info">Осталось: ${left}</div></div><div class="arrow">›</div></div></button>`;
  });$('app').innerHTML=h;
}
function openLocation(id){locationId=id;renderTasks()}
function renderTasks(){
  taskId=null;const l=data.locations.find(x=>x.locationId===locationId);
  let h=top((l?.number||'')+' '+(l?.name||''),'Задания','renderLocations()');
  const ts=data.tasks.filter(t=>t.locationId===locationId&&t.status!=='DONE').sort((a,b)=>String(a.number).localeCompare(String(b.number),undefined,{numeric:true}));
  if(!ts.length)h+='<div class="empty">✅ Всё выполнено</div>';
  ts.forEach(t=>{
    let s='<div class="info">Готово к выполнению</div>';
    if(t.status==='IN_PROGRESS')s=String(t.reservedBy)===telegramUserId?'<div class="mine">● Ваше задание</div>':'<div class="busy">⏳ Выполняется другим</div>';
    h+=`<button class="card" onclick="openTask('${js(t.taskId)}')"><div class="row"><div class="number">${esc(t.number)}</div><div class="content"><div class="card-title">${esc(t.name)}</div>${s}</div><div class="arrow">›</div></div></button>`;
  });$('app').innerHTML=h;
}
async function openTask(id){
  const t=data.tasks.find(x=>x.taskId===id);if(!t)return;
  if(t.status==='IN_PROGRESS'&&String(t.reservedBy)!==telegramUserId){toast('Задание уже занято');return}
  taskId=id;
  if(t.status==='OPEN'){
    // optimistic reservation: screen opens instantly
    t.status='IN_PROGRESS';t.reservedBy=telegramUserId;renderTask();
    try{await api({action:'reserve',taskId:id})}catch(e){t.status='OPEN';t.reservedBy='';renderTasks();toast('Не удалось взять: '+e.message)}
  }else renderTask();
}
function photos(){return data.photos.filter(p=>p.taskId===taskId).sort((a,b)=>a.number-b.number)}
function renderTask(){
  const t=data.tasks.find(x=>x.taskId===taskId);if(!t){renderTasks();return}
  const ps=photos(),required=t.minPhotos>0?t.minPhotos:1,max=t.maxPhotos>0&&ps.length>=t.maxPhotos;
  let grid='';
  ps.forEach(p=>{
    const local=localThumbs[p.photoId];
    const visual=local?`<img src="${local}">`:`<div class="file-tile">📷<br>${esc(p.fileName)}</div>`;
    grid+=`<div class="tile">${visual}<button class="x" onclick="removePhoto('${js(p.photoId)}')">×</button></div>`;
  });
  let h=`<button class="back" onclick="renderTasks()">‹ К заданиям</button><div class="task-name">${esc(t.number)} · ${esc(t.name)}</div><div class="subtitle">Минимум: ${required}${t.maxPhotos>0?' · максимум: '+t.maxPhotos:''}</div>`;
  if(t.instruction)h+=`<div class="instruction"><b>Требование:</b><br>${esc(t.instruction)}</div>`;
  h+=`<div class="counter">📷 Фотографий: <b>${ps.length}</b></div><div class="photo-grid">${grid}</div>
  <button class="action blue" onclick="camera()" ${busy||max?'disabled':''}>📷 Сделать фото</button>
  <button class="action blue" onclick="gallery()" ${busy||max?'disabled':''}>🖼 Выбрать фото</button>
  <button class="action green" onclick="finish()" ${busy||ps.length<required?'disabled':''}>✅ Завершить</button>
  <button class="action red" onclick="cancelTask()" ${busy?'disabled':''}>↩️ Отказаться</button>`;
  $('app').innerHTML=h;
}
function camera(){$('cameraInput').click()}function gallery(){$('galleryInput').click()}
$('cameraInput').onchange=async e=>{if(e.target.files[0])await uploadFiles([e.target.files[0]]);e.target.value=''}
$('galleryInput').onchange=async e=>{const a=[...e.target.files];if(a.length)await uploadFiles(a);e.target.value=''}

async function uploadFiles(files){
  const t=data.tasks.find(x=>x.taskId===taskId);if(!t)return;
  if(t.maxPhotos>0)files=files.slice(0,Math.max(0,t.maxPhotos-photos().length));
  for(const file of files){
    const base=await compress(file);
    const temp='TMP_'+Date.now()+'_'+Math.random();
    const tempPhoto={photoId:temp,taskId,number:photos().length+1,fileName:'Загрузка…'};
    data.photos.push(tempPhoto);localThumbs[temp]=base;renderTask();
    // spinner is added without replacing the whole page
    const tiles=[...document.querySelectorAll('.tile')],tile=tiles[tiles.length-1];
    if(tile){const s=document.createElement('div');s.className='spin';s.innerHTML='<div class="spinner"></div>';tile.appendChild(s)}
    try{
      const r=await api({action:'uploadPhoto',taskId,imageBase64:base});
      data.photos=data.photos.filter(p=>p.photoId!==temp);
      delete localThumbs[temp];
      data.photos.push(r.photo);localThumbs[r.photo.photoId]=base;
      t.photoCount=r.photoCount;renderTask();
    }catch(e){
      data.photos=data.photos.filter(p=>p.photoId!==temp);delete localThumbs[temp];renderTask();toast('Фото не загружено: '+e.message);break;
    }
  }
}
async function removePhoto(id){
  if(!confirm('Удалить фотографию?'))return;
  const p=data.photos.find(x=>x.photoId===id);if(!p)return;
  // optimistic removal
  data.photos=data.photos.filter(x=>x.photoId!==id);renderTask();
  try{await api({action:'deletePhoto',taskId,photoId:id});delete localThumbs[id];renumberLocal()}catch(e){data.photos.push(p);renderTask();toast('Не удалено: '+e.message)}
}
function renumberLocal(){photos().forEach((p,i)=>p.number=i+1);const t=data.tasks.find(x=>x.taskId===taskId);if(t)t.photoCount=photos().length}
async function finish(){
  const id=taskId,t=data.tasks.find(x=>x.taskId===id);if(!confirm('Завершить задание?'))return;
  t.status='DONE';renderTasks();
  try{await api({action:'finishTask',taskId:id})}catch(e){t.status='IN_PROGRESS';taskId=id;renderTask();toast('Не завершено: '+e.message)}
}
async function cancelTask(){
  const id=taskId,t=data.tasks.find(x=>x.taskId===id);if(!confirm('Отказаться? Все загруженные в это задание фото будут удалены.'))return;
  const oldPhotos=data.photos.filter(p=>p.taskId===id);
  t.status='OPEN';t.reservedBy='';t.photoCount=0;data.photos=data.photos.filter(p=>p.taskId!==id);renderTasks();
  try{await api({action:'cancelTask',taskId:id})}catch(e){t.status='IN_PROGRESS';t.reservedBy=telegramUserId;data.photos.push(...oldPhotos);taskId=id;renderTask();toast('Отказ не выполнен: '+e.message)}
}
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=e=>{const i=new Image();i.onerror=rej;i.onload=()=>{let w=i.width,h=i.height,M=1280;if(w>M||h>M){const q=Math.min(M/w,M/h);w=Math.round(w*q);h=Math.round(h*q)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);res(c.toDataURL('image/jpeg',.72))};i.src=e.target.result};r.readAsDataURL(file)})}

/* ================= ADMIN ================= */
function openAdmin(){
  if(!adminPassword){loginAdmin();return}
  renderAdminHome();
}
function modal(html){$('overlay').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`}
function closeModal(){$('overlay').innerHTML=''}
function loginAdmin(){
  modal(`<div class="title">Администратор</div><div class="label">Пароль</div><input id="admPass" class="field" type="password" autocomplete="current-password"><button class="action blue" onclick="doAdminLogin()">Войти</button><button class="action" onclick="closeModal()">Отмена</button>`);
}
async function doAdminLogin(){
  const p=$('admPass').value;if(!p)return;
  try{await api({action:'adminLogin',adminPassword:p});adminPassword=p;sessionStorage.setItem('photo_admin_password',p);renderAdminHome()}catch(e){toast(e.message)}
}
function renderAdminHome(){
  modal(`<div class="admin-head"><div class="title">⚙️ Админ-панель</div><button class="icon-btn" onclick="closeModal()">×</button></div><div class="subtitle">Создание мероприятий и технического задания прямо из приложения.</div><button class="action blue" onclick="newEventForm()">＋ Новое мероприятие</button><button class="action red" onclick="adminLogout()">Выйти из админки</button>`);
}
function adminLogout(){adminPassword='';sessionStorage.removeItem('photo_admin_password');closeModal();toast('Выход выполнен')}
let draft=null;
function newEventForm(){
  draft={name:'',startDate:'',endDate:'',days:[{name:'День 1',date:'',locations:[]}]};renderEventEditor();
}
function renderEventEditor(){
  let h=`<div class="admin-head"><div class="title">Новое мероприятие</div><button class="icon-btn" onclick="renderAdminHome()">×</button></div>
  <div class="label">Название</div><input class="field" value="${esc(draft.name)}" oninput="draft.name=this.value">
  <div class="label">Дата начала</div><input class="field" type="date" value="${esc(draft.startDate)}" oninput="draft.startDate=this.value">
  <div class="label">Дата окончания</div><input class="field" type="date" value="${esc(draft.endDate)}" oninput="draft.endDate=this.value">`;
  draft.days.forEach((d,di)=>{
    h+=`<div class="admin-block"><div class="admin-head"><b>День ${di+1}</b>${draft.days.length>1?`<button class="small danger-text" onclick="draft.days.splice(${di},1);renderEventEditor()">Удалить день</button>`:''}</div>
    <input class="field" placeholder="Название дня" value="${esc(d.name)}" oninput="draft.days[${di}].name=this.value">
    <input class="field" type="date" value="${esc(d.date)}" oninput="draft.days[${di}].date=this.value">`;
    d.locations.forEach((l,li)=>{
      h+=`<div class="admin-block"><div class="admin-head"><b>Локация ${li+1}</b><button class="small danger-text" onclick="draft.days[${di}].locations.splice(${li},1);renderEventEditor()">×</button></div>
      <input class="field" placeholder="Например: Регистрация" value="${esc(l.name)}" oninput="draft.days[${di}].locations[${li}].name=this.value">`;
      l.tasks.forEach((t,ti)=>{
        h+=`<div class="admin-block"><div class="admin-head"><b>Объект ${ti+1}</b><button class="small danger-text" onclick="draft.days[${di}].locations[${li}].tasks.splice(${ti},1);renderEventEditor()">×</button></div>
        <input class="field" placeholder="Стол / Принтер / Автобус" value="${esc(t.name)}" oninput="draft.days[${di}].locations[${li}].tasks[${ti}].name=this.value">
        <div class="row"><input class="field" type="number" min="0" placeholder="Мин. фото" value="${t.minPhotos||''}" oninput="draft.days[${di}].locations[${li}].tasks[${ti}].minPhotos=Number(this.value||0)"><input class="field" type="number" min="0" placeholder="Макс. фото" value="${t.maxPhotos||''}" oninput="draft.days[${di}].locations[${li}].tasks[${ti}].maxPhotos=Number(this.value||0)"></div>
        <textarea class="field" placeholder="Требование к фото" oninput="draft.days[${di}].locations[${li}].tasks[${ti}].instruction=this.value">${esc(t.instruction)}</textarea></div>`;
      });
      h+=`<button class="small" onclick="addTask(${di},${li})">＋ Объект</button></div>`;
    });
    h+=`<button class="small" onclick="addLocation(${di})">＋ Локация</button></div>`;
  });
  h+=`<button class="action" onclick="draft.days.push({name:'День '+(draft.days.length+1),date:'',locations:[]});renderEventEditor()">＋ День</button>
  <button class="action green" onclick="createEvent()">Создать мероприятие</button>`;
  modal(h);
}
function addLocation(di){draft.days[di].locations.push({name:'',tasks:[]});renderEventEditor()}
function addTask(di,li){draft.days[di].locations[li].tasks.push({name:'',minPhotos:0,maxPhotos:0,instruction:''});renderEventEditor()}
async function createEvent(){
  if(!draft.name.trim()){toast('Введите название');return}
  if(!draft.days.some(d=>d.locations.length)){toast('Добавьте хотя бы одну локацию');return}
  const btn=[...document.querySelectorAll('.action.green')].pop();if(btn){btn.disabled=true;btn.textContent='Создание…'}
  try{
    const r=await api({action:'adminCreateEvent',adminPassword,eventSpec:draft});
    modal(`<div class="title">✅ Мероприятие создано</div><div class="admin-block"><b>${esc(draft.name)}</b><br><br>EventID: ${esc(r.eventId)}<br>Token: ${esc(r.token)}<br>Дней: ${r.days}<br>Локаций: ${r.locations}<br>Заданий: ${r.tasks}</div><div class="subtitle">Google-таблица и папки Drive созданы автоматически. Сохраните Token — он используется для открытия именно этого мероприятия.</div><button class="action blue" onclick="renderAdminHome()">Готово</button>`);
  }catch(e){toast('Не создано: '+e.message);if(btn){btn.disabled=false;btn.textContent='Создать мероприятие'}}
}

start();
</script>
</body>
</html>
